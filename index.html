*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0d1119ee;backdrop-filter:blur(12px);padding:16px 5vw;border-bottom:1px solid #222}
.brand{font-size:28px;font-weight:800}.sub{color:#9ca3af;margin-top:4px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button,input{border:1px solid #303744;background:#151a23;color:#fff;border-radius:10px;padding:11px 14px;font-size:15px}
button.active{background:#fff;color:#000}input{flex:1;min-width:220px}
main{padding:22px 5vw}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:#111620;border:1px solid #252c38;border-radius:16px;padding:18px;cursor:pointer;min-height:110px;transition:.15s}
.card:hover,.card:focus{transform:translateY(-2px);border-color:#666;outline:none}
.name{font-weight:700;font-size:16px;line-height:1.4}.group{color:#9ca3af;font-size:13px;margin-top:8px}
dialog{border:0;border-radius:18px;background:#050608;color:#fff;width:min(1000px,94vw);padding:12px}
dialog::backdrop{background:#000b}video{width:100%;background:#000;border-radius:12px;max-height:70vh}
.close{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.empty{color:#9ca3af;text-align:center;padding:50px}
@media (min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
</style>

</header>

const grid=document.getElementById('grid'), empty=document.getElementById('empty'), q=document.getElementById('q');
let tab='الكل';
function render(){
 const s=q.value.trim().toLowerCase();
 const arr=channels.filter(c=>(tab==='الكل'||c.group.includes(tab))&&c.name.toLowerCase().includes(s));
 grid.innerHTML=arr.map((c,i)=>`<div class="card" tabindex="0" data-i="${channels.indexOf(c)}">
   <div class="name">${esc(c.name)}</div><div class="group">${esc(c.group)}</div>
 </div>`).join('');
 empty.hidden=arr.length>0;
 document.querySelectorAll('.card').forEach(el=>{el.onclick=()=>play(channels[+el.dataset.i]);el.onkeydown=e=>{if(e.key==='Enter')play(channels[+el.dataset.i])}});
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function play(c){document.getElementById('title').textContent=c.name; const v=document.getElementById('video'); v.src=c.url; document.getElementById('player').showModal(); v.play().catch(()=>{});}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
q.oninput=render; document.getElementById('player').addEventListener('close',()=>{document.getElementById('video').pause();document.getElementById('video').removeAttribute('src');});
render();
</script>
